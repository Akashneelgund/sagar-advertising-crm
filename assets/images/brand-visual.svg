<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121417" />
      <stop offset="100%" stop-color="#1E232A" />
    </linearGradient>
    <linearGradient id="glowOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FF4500" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0080FF" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="480" cy="120" r="160" fill="#FF5500" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="120" cy="460" r="140" fill="#FF8C00" opacity="0.1" filter="url(#softGlow)" />

  <!-- Isometric Billboard / Signage Board 1 -->
  <g transform="translate(140, 100)">
    <!-- Stand / Pole -->
    <rect x="150" y="220" width="20" height="150" rx="4" fill="#2C323B" />
    <polygon points="110,370 210,370 190,390 130,390" fill="#1A1E24" />

    <!-- Billboard Frame (Perspective) -->
    <rect x="20" y="30" width="280" height="170" rx="12" fill="#181B20" stroke="#343B45" stroke-width="4" />
    <rect x="28" y="38" width="264" height="154" rx="8" fill="#0D0E11" />

    <!-- Illuminated Content -->
    <rect x="40" y="50" width="240" height="130" rx="6" fill="#15181E" />
    
    <!-- SA Brand Monogram Glowing Inside -->
    <rect x="55" y="65" width="40" height="40" rx="8" fill="#FF5500" filter="url(#softGlow)" />
    <path d="M 68 76 C 74 74, 84 76, 82 83 C 80 88, 70 87, 72 93" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    
    <text x="108" y="82" font-family="'Montserrat', sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" letter-spacing="1">SAGAR ADVERTISING</text>
    <text x="108" y="96" font-family="sans-serif" font-weight="600" font-size="9" fill="#FF7A00" letter-spacing="1.5">3D LED & SIGNAGE EXPERTS</text>

    <!-- Visual Sound / Floating Light Bars -->
    <rect x="55" y="125" width="45" height="6" rx="3" fill="#FF5500" />
    <rect x="108" y="125" width="70" height="6" rx="3" fill="#3A424E" />
    <rect x="186" y="125" width="80" height="6" rx="3" fill="#FF7A00" opacity="0.8" />
    <rect x="55" y="137" width="120" height="4" rx="2" fill="#2C323B" />
  </g>

  <!-- Floating 3D Acrylic Lettering 'A D S' -->
  <g transform="translate(340, 320)">
    <rect x="0" y="0" width="180" height="110" rx="14" fill="#1C2128" stroke="#FF5500" stroke-width="2" filter="url(#softGlow)" />
    <text x="20" y="38" font-family="'Montserrat', sans-serif" font-weight="900" font-size="18" fill="#FFFFFF">GROWTH & ROI</text>
    <text x="20" y="65" font-family="'Montserrat', sans-serif" font-weight="800" font-size="28" fill="#FF5500">+185%</text>
    <text x="20" y="88" font-family="sans-serif" font-size="11" fill="#8E99A8">Outdoor Brand Reach</text>
  </g>

  <!-- Mobile Floating Van Graphic Badge -->
  <g transform="translate(80, 380)">
    <rect x="0" y="0" width="200" height="90" rx="14" fill="#1A1E24" stroke="#2E3642" stroke-width="1.5" />
    <circle cx="35" cy="45" r="20" fill="#FF5500" opacity="0.2" />
    <text x="28" y="52" font-size="20">🚚</text>
    <text x="68" y="38" font-family="sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Transit Advertising</text>
    <text x="68" y="55" font-family="sans-serif" font-size="11" fill="#FF7A00">Mobile Van & Floats</text>
    <text x="68" y="70" font-family="sans-serif" font-size="10" fill="#717C8C">Hubballi & Dharwad</text>
  </g>

  <!-- Bottom Agency Badges -->
  <g transform="translate(60, 520)">
    <rect x="0" y="0" width="480" height="44" rx="8" fill="#14171C" stroke="#222831" />
    <text x="20" y="27" font-family="sans-serif" font-size="11" fill="#7B8794">✨ 3D/2D LED Boards</text>
    <text x="145" y="27" font-family="sans-serif" font-size="11" fill="#7B8794">🏢 ACP Interiors</text>
    <text x="260" y="27" font-family="sans-serif" font-size="11" fill="#7B8794">🪧 Glow Signs</text>
    <text x="365" y="27" font-family="sans-serif" font-size="11" fill="#FF7A00">⚡ Live Quotations</text>
  </g>
</svg>
