<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 95" width="100%" height="100%">
  <defs>
    <linearGradient id="saOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FF4500" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF5500" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- SA Monogram Badge -->
  <g transform="translate(10, 8)">
    <!-- Base dark rounded diamond / shield -->
    <rect x="0" y="0" width="76" height="76" rx="16" fill="#121417" />
    
    <!-- Dynamic curved orange wing / advertising beam -->
    <path d="M 12 56 C 15 26, 46 11, 65 11 C 57 24, 46 33, 34 45 C 23 55, 16 56, 12 56 Z" fill="url(#saOrangeGrad)" filter="url(#shadow)" />
    
    <!-- Stylized 'S' stroke -->
    <path d="M 50 26 C 40 20, 26 23, 24 34 C 22 42, 42 41, 44 51 C 45 58, 34 64, 23 60" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Stylized 'A' cross / upward arrow triangle -->
    <polygon points="53,32 65,60 57,60 54,52 44,52 47,45 52,45" fill="#FF5500" />
  </g>

  <!-- Typography: SAGAR ADVERTISING -->
  <text x="102" y="47" font-family="'Montserrat', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="27" fill="#121417" letter-spacing="1.5">SAGAR</text>
  <text x="216" y="47" font-family="'Montserrat', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="27" fill="#FF5500" letter-spacing="1.5">ADVERTISING</text>

  <!-- Orange Line Separator -->
  <rect x="102" y="55" width="345" height="3" rx="1.5" fill="url(#saOrangeGrad)" />

  <!-- Tagline: Your Brand. Our Passion. -->
  <text x="103" y="73" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="11.5" fill="#555555" letter-spacing="2.8">YOUR BRAND. OUR PASSION.</text>
</svg>
